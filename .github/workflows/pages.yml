# 只挂 main。上一版把 feat 分支也挂上了，两秒就红：github-pages 这个环境默认带
# 分支保护规则，只允许默认分支部署。那条红的根因在环境配置，不在产品。
#
# 代价要说清：这条链路在合进主干之前一次都没真跑过，它现在属于「写完就搁着的
# 断言」。docs/obligations.json 里登记了一条带期限的义务盯这件事。
#
# 部署完要回头读一遍那个 URL：推上去不等于玩得到。而且要同时查两个锥子（脚本
# 路径 + canvas 的 id），否则一个 404 页也能让单一 grep 免费通过。
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: 部署试玩页
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: 打包静态站
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          cp index.html site/
          cp -R src site/
          test -s site/index.html
          test -s site/src/main.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: 核对部署真的活了
        shell: bash
        env:
          URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          test -n "$URL"
          for attempt in 1 2 3 4 5 6 7 8; do
            body=$(curl --fail --silent --show-error --location --max-time 20 "$URL" || true)
            if printf '%s' "$body" | grep -q 'src/main.mjs' && printf '%s' "$body" | grep -q 'id="stage"'; then
              echo "第 $attempt 次验到了：$URL"
              exit 0
            fi
            sleep 15
          done
          echo "试了 8 次都没从 $URL 读到试玩页（这不是部署成功）"
          exit 1
