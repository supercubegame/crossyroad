# 只挂 main。之前把 feat 分支也挂上了，两秒就红：github-pages 这个环境默认带
# 分支保护规则，只允许默认分支部署。那条红的根因在环境配置，不在产品。
#
# 部署完要回头读一遍那个 URL：推上去不等于玩得到。那段逻辑已经搬去
# scripts/pages-check.mjs，因为写在这里的 shell 离线触发不了,而一条从没红过的
# 断言和一条空断言分不出来。现在快闸门里有两个必然失败的样本在验它。
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: 部署试玩页
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/configure-pages@v5
      - name: 打包静态站
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          cp index.html site/
          cp -R src site/
          test -s site/index.html
          test -s site/src/main.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: 核对部署真的活了
        shell: bash
        env:
          URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/pages-check.mjs "$URL"
