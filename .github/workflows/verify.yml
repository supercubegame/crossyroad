name: verify

# 只挂 push 曾经够用，现在不够：没人推代码的时候，上游（共享回写 workflow、
# Playwright、runner 镜像）改了行为，而闸门仍然“全绿”，因为它压根没跑。
# 外部结构漂移是时间驱动的，所以除了 push 还要挂定时。
#
# 分钟数故意不取整点（整点是平台排队高峰），有一条断言守着。
# 频率故意取每天而不是每周：写得越勤，“读到的痕迹有多旧”就越不依赖两个定时
# 之间的先后顺序,而那个顺序是个假设。实测过一次平台延迟近一小时。
# cron 频率与新鲜度上限是一组耦合参数。
#
# **action 的大版本是上游漂移的一个入口，而版本号只是个代理量。**
# 实测：upload-artifact **v5 的发布说明写着支持 Node 24，而 runner 注解说它
# 仍然 target Node 20**。v6 的说明自己承认了这件事。所以版本号升了不等于
# 运行时升了,真值只在 runner 的注解里，而那东西从仓库内部读不到。
# 这条已写进 AGENTS.md 的「测不出来的」。
on:
  push:
    branches: ['**']
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      write_heartbeat:
        description: 手动验一次心跳链路（写进 last_manual_run，不参与新鲜度判定）
        type: boolean
        default: false

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: 引擎闸门
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: 跑引擎闸门
        id: gate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          npm run verify 2>&1 | tee artifacts/stdout-eng.log
      - name: 上传报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: report-eng
          path: artifacts/
          retention-days: 14
          if-no-files-found: warn
      - name: 失败则让 job 失败
        if: steps.gate.outcome != 'success'
        run: exit 1

  web:
    name: 浏览器闸门
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: 装依赖
        run: npm install --no-audit --no-fund
      - name: 装字体
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: 装 Chromium
        run: npx playwright install --with-deps chromium
      - name: 跑浏览器闸门
        id: web
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts
          npm run verify:web 2>&1 | tee artifacts/stdout-web.log
      - name: 上传报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: report-web
          path: artifacts/
          retention-days: 14
          if-no-files-found: warn
      - name: 失败则让 job 失败
        if: steps.web.outcome != 'success'
        run: exit 1

  # ==========================================================================
  # 心跳。它存在的理由只有一个：平台会因为仓库长期不活跃**静默停用定时
  # 工作流**，而那时 workflow 文件一个字都不会变,“读配置确认 cron 还在”这条
  # 检查会在它本该抓住的那次失效上保持绿色。“没有坏消息”和“已经死了”
  # 长得一模一样，带时间戳的正向痕迹不会。
  #
  # 它已经兑现过一次：某次 UI 的 event 过滤器回报“0 条定时运行”，而这份文件里
  # 已经有 schedule 盖的戳。两个读取通道打架时，正向痕迹赢了。
  #
  # 三个设计点，每一个都有断言在守：
  #
  # 1. **always()**,闸门红也要盖戳。心跳回答的是“这条链还活着吗”，
  #    不是“产品对不对”。两件事混在一起的话，一次真失败会伪装成一条死 cron。
  # 2. **防自触发靠结构，不靠提交信息里的跳过标记。** 这一步只在 schedule
  #    或显式手动请求时执行，它推出去的提交触发的是普通 push，那一次永远不写。
  #    循环由构造终止。这一条已经实测过：心跳提交触发了一次 push 运行，而它没再写。
  # 3. **手动那条路写的是另一个字段。** 新鲜度只读 last_scheduled_run,
  #    一次手动盖戳不得救活一条已经死掉的 cron。
  #
  # **提交信息的措辞与事件是一组耦合参数。** 它已经说过一次谎：手动跑的那次
  # 写的也是“定时闸门跑过了”。现在措辞从 $EVENT 派生，并且有四条断言守着,
  # 包括一条承重的负向：提交命令里不许再出现字面量。已经实测跑通。
  # ==========================================================================
  heartbeat:
    name: 写心跳
    needs: [gate, web]
    if: always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.write_heartbeat))
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false

      - name: 盖戳
        env:
          EVENT: ${{ github.event_name }}
          GATE_RESULT: ${{ needs.gate.result }}
          WEB_RESULT: ${{ needs.web.result }}
        run: node scripts/write-heartbeat.mjs

      # 这里不能写 `git diff --cached --quiet && echo ... && exit 0`：开了 set -e 之后，
      # diff 发现有改动时返回 1，整个 && 链的退出码就是 1，步骤反而失败。
      - name: 推回主干
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add heartbeat.json
          if git diff --cached --quiet; then
            echo '心跳内容没变化，不造空提交'
            exit 0
          fi
          if [ "$EVENT" = 'schedule' ]; then
            msg="心跳：定时闸门跑过了"
          else
            msg="心跳：手动验了一次链路（$EVENT，不参与新鲜度判定）"
          fi
          git commit -m "$msg"
          git push origin HEAD:main

  report:
    name: 回报结果
    needs: [gate, web]
    if: always()
    permissions:
      contents: write
      pull-requests: write
    uses: supercubegame/ci-workflows/.github/workflows/report.yml@main
    with:
      node-version: '22'
      gates: '[{"name":"引擎闸门","result":"${{ needs.gate.result }}"},{"name":"浏览器闸门","result":"${{ needs.web.result }}"}]'
      composer-files: scripts/compose-report.mjs
      composer-entry: scripts/compose-report.mjs
      marker: '<!-- verify-gate -->'
