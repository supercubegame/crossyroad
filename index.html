<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CROSSYROAD 过马路</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0b0b10; color: #f2f2f7;
    font-family: 'Noto Sans CJK SC', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
  }
  #wrap { position: relative; }
  #hud {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 8px 2px; font-size: 15px; letter-spacing: .04em;
  }
  #hud b { font-size: 22px; }
  canvas { display: block; border-radius: 10px; background: #101018; }
  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0; top: 44px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; text-align: center; padding: 24px;
  }
  .sheet[hidden] { display: none; }
  .sheet h1 { margin: 0; font-size: 30px; letter-spacing: .06em; }
  .sheet p { margin: 0; font-size: 15px; line-height: 1.7; color: #c9c9d4; }
  button {
    font: inherit; font-size: 16px; padding: 10px 24px; border: 0; border-radius: 999px;
    background: #f5d90a; color: #1a1a22; cursor: pointer;
  }
  kbd {
    font: inherit; font-size: 13px; padding: 1px 7px; border-radius: 5px;
    background: #2a2a36; border: 1px solid #3b3b4a;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud"><span>分数 <b id="score">0</b></span><span>最高 <b id="best">0</b></span></div>
  <canvas id="stage" width="432" height="624"></canvas>

  <div class="sheet" id="menu">
    <h1>过马路</h1>
    <p><kbd>↑</kbd> 往前跳，<kbd>←</kbd> <kbd>→</kbd> 挪一格<br>躲开车，踩着木头过河<br>手机上点一下往前，划一下换方向</p>
    <button id="play">开始</button>
  </div>

  <div class="sheet" id="over" hidden>
    <h1 id="why">结束了</h1>
    <p>这一局走了 <b id="final">0</b> 行</p>
    <button id="again">再来一次</button>
  </div>
</div>
<script type="module" src="./src/main.mjs"></script>
</body>
</html>
